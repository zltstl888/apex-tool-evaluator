name: Behavior report
description: Report a reproducible problem in the Skill's decision behavior.
title: "[Behavior]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, private paths, or confidential tool inventories.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What decision were you asking the Skill to make?
      placeholder: Describe the workflow, candidate type, and available authority using public or synthetic details.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What did the Skill return?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What decision boundary, evidence rule, or verdict should have applied?
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release or commit
      placeholder: v0.1.2 or a commit SHA
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed credentials, customer data, private paths, and confidential identifiers.
          required: true
